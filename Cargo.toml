[package]
name = "handl-plugin-lib-char-native"
version = "0.1.0"
edition = "2024"
description = "Native `char` module — the Rust `std::char` backend for the `char` contract"
license = "MIT OR Apache-2.0"
repository = "https://github.com/handl-lang/lib-char-native"

[dependencies]
handl-platform = { git = "https://github.com/handl-lang/host", branch = "main" }
handl-lib-char = { git = "https://github.com/handl-lang/lib-char", branch = "main" }
serde_json = "1"

[patch."https://github.com/handl-lang/lib-char"]
handl-lib-char = { path = "../lib-char" }

[patch."https://github.com/handl-lang/host"]
handl-platform = { path = "../host/crates/platform" }
