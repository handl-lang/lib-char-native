[package]
name = "handl-plugin-lib-char-native"
version = "0.1.0"
edition = "2024"
description = "Native `char` module — the Rust `std::char` backend for the `char` contract"
license = "MIT"
repository = "https://github.com/handl-lang/lib-char-native"

[dependencies]
handl-ops = { git = "https://github.com/handl-lang/kernel", branch = "main" }
serde_json = "1"

[patch."https://github.com/handl-lang/kernel"]
handl-ops = { path = "../kernel/crates/handl-ops" }

[build-dependencies]
handl-pkg-vendor = { path = "../host/crates/pkg-vendor" }
